<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Навигационное меню -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
            <img class="headerLogo__logo" src="DJavakhirDJon.png" alt="DJavakhirDJon">
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Главная</a>
                </li>
                <li class="nav-item">
                    <a href="calculator.html" class="nav-link active">Калькулятор</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">Обо мне</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container calculator-page">
            <!-- Пункт 19: Цель ЛР с подсветкой -->
            <div class="lab-purpose">
                <p><span class="highlight">Цель ЛР:</span> <span class="highlight-word">знакомство</span> с основами <span class="highlight-word">HTML</span> и <span class="highlight-word">CSS</span></p>
            </div>

            <!-- Пункт 10: Выравнивание по центру -->
            <div class="calculator-container">
                <!-- Пункт 12: Кнопка смены темы -->
                <button id="theme-toggle" class="theme-btn">🌙 Сменить тему</button>
                
                <div class="calculator">
                    <!-- Пункт 4,5,11: Измененный результат -->
                    <div id="result" class="result">0</div>

                    <!-- Кнопки калькулятора -->
                    <div class="buttons-grid">
                        <div class="button-row">
                            <button id="btn_op_clear" class="my-btn secondary">C</button>
                            <button id="btn_op_sign" class="my-btn secondary">+/-</button>
                            <button id="btn_op_percent" class="my-btn secondary">%</button>
                            <button id="btn_op_div" class="my-btn primary">/</button>
                        </div>
                        <div class="button-row">
                            <button id="btn_digit_7" class="my-btn">7</button>
                            <button id="btn_digit_8" class="my-btn">8</button>
                            <button id="btn_digit_9" class="my-btn">9</button>
                            <button id="btn_op_mult" class="my-btn primary">x</button>
                        </div>
                        <div class="button-row">
                            <button id="btn_digit_4" class="my-btn">4</button>
                            <button id="btn_digit_5" class="my-btn">5</button>
                            <button id="btn_digit_6" class="my-btn">6</button>
                            <button id="btn_op_minus" class="my-btn primary">-</button>
                        </div>
                        <div class="button-row">
                            <button id="btn_digit_1" class="my-btn">1</button>
                            <button id="btn_digit_2" class="my-btn">2</button>
                            <button id="btn_digit_3" class="my-btn">3</button>
                            <button id="btn_op_plus" class="my-btn primary">+</button>
                        </div>
                        <div class="button-row">
                            <button id="btn_digit_0" class="my-btn">0</button>
                            <button id="btn_digit_dot" class="my-btn">.</button>
                            <button id="btn_op_equal" class="my-btn primary execute">=</button>
                        </div>
                    </div>
                </div>

                <!-- Пункт 18: Сворачивающиеся подробности -->
                <details class="author-details">
                    <summary>👤 Автор</summary>
                    <p>ФИО: Иванов Иван Иванович</p>
                    <p>Группа: ИТ-101</p>
                </details>

                <!-- Пункт 17: Выпадающий список -->
                <div class="dropdown-container">
                    <label for="calc-select">Тип калькулятора:</label>
                    <select id="calc-select" class="dropdown">
                        <option value="standard">Стандартный</option>
                        <option value="scientific">Инженерный</option>
                        <option value="programmer">Программиста</option>
                    </select>
                </div>

                <!-- Пункт 16: Кнопка GitHub -->
                <a href="https://github.com/ivanov" target="_blank" class="github-link">
                    <button class="my-btn github-btn">GitHub</button>
                </a>
            </div>
        </div>
    </main>

    <!-- Пункт 9: Надпись внизу -->
    <footer class="footer">
        <p>ЛР выполнена Иванов И.И. | Группа ИТ-101 | 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
