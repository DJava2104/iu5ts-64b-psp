<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Пункт 10: Выравнивание по центру -->
  <div class="calculator-container">
    <!-- Пункт 12: Кнопка смены темы -->
    <button id="theme-toggle" class="theme-btn">Сменить тему</button>
    
    <!-- Пункт 19: Поле с целью ЛР -->
    <div class="lab-purpose">
    <div class="10_x" data-header="false" tabindex></div>
      <div class="10_i container"></div> 
      <p><span class="highlight">CalculatorMangaHTML</span> <span class="highlight-word">знакомство</span> с основами <span class="highlight-word">HTML</span> и <span class="highlight-word">CSS</span></p>
    </div>
    
    <div class="calculator">
      <!-- Пункт 11: Увеличенный размер окна вывода + Пункт 5: Скругленные края -->
      <!-- Пункт 4: Измененный цвет вывода результата + Пункт 14: Смена цвета шрифта -->
      <div id="result" class="result">
        0
      </div>

      <!-- блок с кнопками калькулятора -->
      <div>
        <!--горизонтальный ряд из четырех кнопок-->
      <div>  
          <button id="btn_op_clear" class="my-btn secondary">C</button>
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_div" class="my-btn primary">/</button>
        </div>

        <div>
          <button id="btn_digit_7" class="my-btn">7</button>
          <button id="btn_digit_8" class="my-btn">8</button>
          <button id="btn_digit_9" class="my-btn">9</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>
        </div>

        <div>
          <button id="btn_digit_4" class="my-btn">4</button>
          <button id="btn_digit_5" class="my-btn">5</button>
          <button id="btn_digit_6" class="my-btn">6</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>
        </div>

        <div>
          <button id="btn_digit_1" class="my-btn">1</button>
          <button id="btn_digit_2" class="my-btn">2</button>
          <button id="btn_digit_3" class="my-btn">3</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>
        </div>

        <div>
          <button id="btn_digit_0" class="my-btn">0</button>
          <button id="btn_digit_dot" class="my-btn">.</button>
          <button id="btn_op_equal" class="my-btn primary execute">=</button>
        </div>
      </div>
    </div>
    
    <!-- Пункт 18: Сворачивающиеся подробности (Автор -> ФИО, Группа) -->
    <details class="author-details">
      <summary>Автор</summary>
      <p>ФИО: Тошниёзов Жавохир Голибжон</p>
      <p>Группа: ИУ5Ц-64Б</p>
    </details>
    
    <!-- Пункт 9: Надпись внизу "ЛР выполнена ФИО" -->
    <div class="footer-note">
      ЛР выполнена Тошниёзоа Ж.Г.
    </div>
    
    <!-- Пункт 17: Поле с выпадающим списком -->
    <div class="dropdown-container">
      <label for="calc-select">Выберите тип калькулятора:</label>
      <select id="calc-select" class="dropdown">
        <option value="standard">Стандартный</option>
        <option value="scientific">Инженерный</option>
        <option value="programmer">Программиста</option>
      </select>
    </div>
    
    <!-- Пункт 16: Кнопка со ссылкой на GitHub -->
    <a href="https://github.com/DJava2104" target="_blank" class="github-link">
      <button class="my-btn github-btn">GitHub</button>
    </a>
    
    <!-- Пункт 15: Изображение на фоне добавлено в CSS -->
  </div>
  
  <!-- Простой скрипт для смены темы -->
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', function() {
      document.body.classList.toggle('dark-theme');
    });
  </script>
</body>
</html>
